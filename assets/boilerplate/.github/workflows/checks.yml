name: Django checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [fullstack, api, hybrid]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      APP_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py test
      - if: matrix.mode != 'fullstack'
        run: uv run python manage.py spectacular --file /tmp/schema.yaml --validate --fail-on-warn
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app -d app" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      APP_MODE: hybrid
      TEST_DATABASE_URL: postgres://app:ci-only-password@127.0.0.1:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python manage.py test
