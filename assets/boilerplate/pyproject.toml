[project]
name = "django-starter"
version = "0.1.0"
description = "Django fullstack and REST API starter with Unfold admin"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=6.1.2,<6.2",
  "django-unfold>=0.110.0,<0.111",
  "djangorestframework>=3.18.3,<3.19",
  "drf-spectacular[sidecar]>=0.30.0,<0.31",
  "django-environ>=0.14.0,<0.15",
  "whitenoise>=6.12.0,<7",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<26",
]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"**/migrations/*.py" = ["E501"]
